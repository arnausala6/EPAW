<!DOCTYPE html>
<html lang=en>

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="assets/upf.png">
	<title> U </title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/groups-page.css">
	<link rel="stylesheet" href="css/group-detail.css">
	<link rel="stylesheet" href="css/banned-user.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script>
		window.App = window.App || {};
		App.Errors = App.Errors || {};
	</script>
	<script src="js/LoginValidation.js"></script>
	<script src="js/RegisterValidation.js"></script>

	<script>
		App.init = function () {

			$.ajaxSetup({ cache: false });
			$('#navigation').load("Menu");
			$('#content').load("Content");
			$('#lcolumn').html("<p/>");
			$('#rcolumn').html("<p/>");
			App.bindEvents();

		};

		App.bindEvents = function () {

			$(document).on("click", ".menu", function (event) {
				event.preventDefault();
				$('#content').load($(this).attr('href'), function () {
					$('#navigation').load("Menu");
				});
			});

			App.applyVoteState = function (bar, userVote) {
				/* userVote: 1 | -1 | null */
				bar.find(".btn-vote-up").removeClass("act-voted act-voted-down");
				bar.find(".btn-vote-down").removeClass("act-voted act-voted-down");
				if (userVote === 1) {
					bar.find(".btn-vote-up").addClass("act-voted");
				} else if (userVote === -1) {
					bar.find(".btn-vote-down").addClass("act-voted-down");
				}
			};

			$(document).on("click", ".btn-vote", function () {
				const btn = $(this);
				const bar = btn.closest(".post-actions-bar");
				const allVoteBtns = bar.find(".btn-vote");
				const postId = btn.attr("data-post-id");
				const voteType = parseInt(btn.attr("data-vote-type"), 10);

				if (allVoteBtns.prop("disabled")) {
					return;
				}
				allVoteBtns.prop("disabled", true);

				$.ajax({
					type: "POST",
					url: "VotePost",
					data: { postId: postId, voteType: voteType },
					dataType: "json"
				}).done(function (res) {
					if (!res || res.error) {
						return;
					}
					/* Update counts */
					bar.find(".vote-count-up").text(res.upvotes);
					bar.find(".vote-count-down").text(res.downvotes);
					/* Update selected state: res.userVote is 1, -1 or null */
					const uv = (res.userVote === null || res.userVote === undefined)
						? null : Number(res.userVote);
					App.applyVoteState(bar, uv);
				}).always(function () {
					allVoteBtns.prop("disabled", false);
				});
			});

			/* ── Comments ─────────────────────────────────── */

			function closeCommentThread(thread) {
				thread.hide();
				const postId = thread.attr("data-post-id");
				if ($('#rcolumn').find('[name="postId"][value="' + postId + '"]').length) {
					$('#rcolumn').html('<p/>');
				}
			}

			$(document).on("click", ".btn-toggle-comments", function () {
				const btn = $(this);
				const postId = btn.attr("data-post-id");
				const article = btn.closest("article");
				const thread = article.find(".comment-thread[data-post-id='" + postId + "']");
				if (!thread.length) return;

				if (thread.is(":visible")) {
					closeCommentThread(thread);
					return;
				}

				// Close any other open comment thread first
				$('.comment-thread:visible').each(function () {
					closeCommentThread($(this));
				});

				const inner = thread.find(".comment-thread-inner");
				const doShow = function (html) {
					if (html !== null) {
						inner.html(html);
						inner.data("loaded", true);
					}
					thread.show();
					$('#rcolumn').load("AddComment?postId=" + postId);
				};

				if (inner.data("loaded")) {
					doShow(null);
				} else {
					$.get("Comments?postId=" + postId, function (html) { doShow(html); });
				}
			});

			$(document).on("click", ".btn-collapse-comments", function () {
				const postId = $(this).attr("data-post-id");
				const thread = $('.comment-thread[data-post-id="' + postId + '"]');
				closeCommentThread(thread.length ? thread : $(this).closest(".comment-thread"));
			});

			$(document).on("click", ".btn-edit-comment", function () {
				const commentId = $(this).attr("data-comment-id");
				$('#rcolumn').load("EditComment?commentId=" + commentId);
			});

			$(document).on("click", ".btn-delete-comment", function () {
				const commentId = $(this).attr("data-comment-id");
				$('#rcolumn').load("DeleteComment?commentId=" + commentId);
			});

			$(document).on("click", ".btn-edit-post", function () {
				const postId = $(this).attr("data-post-id");
				const view = $(this).attr("data-view") || "group";
				$('#rcolumn').load("EditPost?postId=" + postId + "&view=" + view);
			});

			$(document).on("click", ".btn-delete-post", function () {
				const postId = $(this).attr("data-post-id");
				const view = $(this).attr("data-view") || "group";
				$('#rcolumn').load("DeletePost?postId=" + postId + "&view=" + view);
			});

			/* ─────────────────────────────────────────────── */

			$(document).on("submit", "form", function (event) {
				if ($(this).closest('#rcolumn').length) {
					return;
				}
				event.preventDefault();
				const form = this;
				const data = new FormData(form);

				$.ajax({
					type: 'POST',
					enctype: 'multipart/form-data',
					url: $(form).attr('action'),
					data: data,
					processData: false,
					contentType: false
				}).done(function (html) {
					$('#navigation').load("Menu");
					$("#content").html(html);
				});
			});

			App.mountRcolumnPanel = function (html, formId) {
				if (formId && html.indexOf('id="' + formId + '"') !== -1) {
					$('#rcolumn').html(html);
					$('#rcolumn').find('script').each(function () {
						$.globalEval(this.text || this.textContent || this.innerHTML || '');
					});
				} else {
					$('#rcolumn').html('<p/>');
					$('#content').html(html);
				}
			};
		};

		App.stack = function () {
			$("#stack").toggleClass("nav-stack-open");
		};

		$(document).ready(function () {
			App.init();
		});

	</script>

</head>

<body>

	<header class="topbar" id="navigation"></header>

	<main class="shell">
		<aside class="col-l">
			<div id="lcolumn"></div>
		</aside>
		<section class="col-c">
			<div id="content"></div>
		</section>
		<aside class="col-r">
			<div id="rcolumn"></div>
		</aside>
	</main>

	<footer class="footer">
		<p>Groupwise · UPF EPAW</p>
	</footer>

</body>

</html>
