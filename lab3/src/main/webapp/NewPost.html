<div class="card card-flush page-head">
	<div class="card-head">
		<h3><img src="assets/icons/publicar-blanco.png" alt="" class="ico"> New post</h3>
	</div>
	<div class="card-body">
		<form>
			<div class="form-field">
				<label for="postTitle">Title</label>
				<input class="input" type="text" id="postTitle" name="title" placeholder="What is your post about?">
			</div>

			<div class="form-field">
				<label for="postBody">Content</label>
				<textarea class="input" id="postBody" name="body" style="height: 140px;" placeholder="Write something for the community..."></textarea>
			</div>

			<div class="form-field">
				<label for="postImage">Attach image</label>
				<input class="input" type="file" id="postImage" name="postImage" accept="image/jpeg,image/png,image/webp,image/gif">
			</div>

			<div class="form-field">
				<label for="postVisibility">Visibility</label>
				<select class="input" id="postVisibility" name="visibility">
					<option>Public</option>
					<option>Followers only</option>
					<option>Group only</option>
				</select>
			</div>

			<div class="btn-row">
				<button type="button" class="btn btn-primary">
					<img src="assets/icons/publicar-blanco.png" alt="" class="ico"> Publish post
				</button>
				<span class="hint">Mockup only: no post is created yet.</span>
			</div>
		</form>
	</div>
</div>
