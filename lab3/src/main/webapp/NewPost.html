<div class="w3-card w3-white">
	<header class="w3-container w3-theme">
		<h3><i class="fa fa-plus-square"></i> New post</h3>
	</header>

	<div class="w3-container w3-padding">
		<form>
			<div class="w3-section">
				<label for="postTitle" class="w3-text-grey">Title</label>
				<input class="w3-input w3-border" type="text" id="postTitle" name="title" placeholder="What is your post about?">
			</div>

			<div class="w3-section">
				<label for="postBody" class="w3-text-grey">Content</label>
				<textarea class="w3-input w3-border" id="postBody" name="body" style="height: 140px;" placeholder="Write something for the community..."></textarea>
			</div>

			<div class="w3-section">
				<label for="postImage" class="w3-text-grey">Attach image</label>
				<input class="w3-input w3-border" type="file" id="postImage" name="postImage" accept="image/jpeg,image/png,image/webp,image/gif">
			</div>

			<div class="w3-section">
				<label for="postVisibility" class="w3-text-grey">Visibility</label>
				<select class="w3-input w3-border" id="postVisibility" name="visibility">
					<option>Public</option>
					<option>Followers only</option>
					<option>Group only</option>
				</select>
			</div>

			<button type="button" class="w3-button w3-theme">
				<i class="fa fa-paper-plane"></i> Publish post
			</button>
			<span class="w3-small w3-text-grey w3-margin-left">Mockup only: no post is created yet.</span>
		</form>
	</div>
</div>
