<div class="w3-card w3-white">
	<header class="w3-container w3-theme">
		<h3><img src="assets/icons/admin-blanco.png" alt="" class="ico ico-fw"> Admin Panel</h3>
	</header>

	<div class="w3-container w3-padding">

		<div class="w3-row-padding w3-margin-top w3-margin-bottom">
			<div class="w3-col s4">
				<div class="w3-card w3-padding w3-center">
					<h2>3</h2>
					<p class="w3-text-grey">Total users</p>
				</div>
			</div>
			<div class="w3-col s4">
				<div class="w3-card w3-padding w3-center">
					<h2>1</h2>
					<p class="w3-text-grey">Blocked users</p>
				</div>
			</div>
			<div class="w3-col s4">
				<div class="w3-card w3-padding w3-center">
					<h2>2</h2>
					<p class="w3-text-grey">Active groups</p>
				</div>
			</div>
		</div>

		<div class="w3-card w3-margin-top w3-margin-bottom">
			<div class="w3-container w3-padding">
				<h4><img src="assets/icons/grupos-terracota.png" alt="" class="ico ico-fw"> User management</h4>
				<table class="w3-table w3-bordered w3-border">
					<thead>
						<tr class="w3-light-grey">
							<th>Username</th>
							<th>Role</th>
							<th>Status</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>admin</td>
							<td><span class="w3-tag-white">admin</span></td>
							<td><span class="w3-tag-white">active</span></td>
						</tr>
						<tr>
							<td>arnau</td>
							<td><span class="w3-tag-white">user</span></td>
							<td><span class="w3-tag-white">active</span></td>
							<td>
								<button type="button" class="w3-button w3-tiny w3-pale-red"><img src="assets/icons/block-error.png" alt="" class="ico ico-fw"> Block</button>
							</td>
						</tr>
						<tr>
							<td>marti</td>
							<td><span class="w3-tag-white">user</span></td>
							<td><span class="w3-tag-white">blocked</span></td>
							<td>
								<button type="button" class="w3-button w3-tiny w3-light-grey"><img src="assets/icons/unblock-ok.png" alt="" class="ico ico-fw"> Unblock</button>
							</td>
						</tr>
					</tbody>
				</table>
				<p class="w3-small w3-text-grey w3-margin-top">Mockup only: user list is not yet loaded from the database.</p>
			</div>
		</div>

	</div>
</div>
