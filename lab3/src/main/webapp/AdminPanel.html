<div class="card card-flush page-head">
	<div class="card-head">
		<h3><img src="assets/icons/admin-blanco.png" alt="" class="ico"> Admin Panel</h3>
	</div>
	<div class="card-body">
		<div class="stat-grid">
			<div class="card stat-card">
				<h2>3</h2>
				<p class="text-muted">Total users</p>
			</div>
			<div class="card stat-card">
				<h2>1</h2>
				<p class="text-muted">Blocked users</p>
			</div>
			<div class="card stat-card">
				<h2>2</h2>
				<p class="text-muted">Active groups</p>
			</div>
		</div>

		<div class="card">
			<h4><img src="assets/icons/grupos-terracota.png" alt="" class="ico"> User management</h4>
			<table class="data-table">
				<thead>
					<tr>
						<th>Username</th>

						<th>Status</th>
						<th>Actions</th>

				</thead>
				<tbody>
					<tr>
						<td>admin</td>
						<td><span class="chip">admin</span></td>
						<td><span class="chip">active</span></td>
						<td></td>
					</tr>
					<tr>
						<td>arnau</td>
						<td><span class="chip">user</span></td>
						<td><span class="chip">active</span></td>
						<td>
							<button type="button" class="btn btn-err btn-sm"><img src="assets/icons/block-error.png" alt="" class="ico"> Block</button>
						</td>
					</tr>
					<tr>
						<td>marti</td>
						<td><span class="chip">user</span></td>
						<td><span class="chip">blocked</span></td>
						<td>
							<button type="button" class="btn btn-muted btn-sm"><img src="assets/icons/unblock-ok.png" alt="" class="ico"> Unblock</button>
						</td>
					</tr>
				</tbody>
			</table>
			<p class="hint">Mockup only: user list is not yet loaded from the database.</p>
