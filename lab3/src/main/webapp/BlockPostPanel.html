<div class="card card-flush">
	<div class="card-head panel-head">
		<h5><img src="assets/icons/block-blanco.png" alt="" class="ico"> Block post</h5>
		<button type="button" class="panel-close" onclick="$('#rcolumn').html('<p/>')">&times;</button>
	</div>
	<div class="card-body">
		<form>
			<div class="form-field">
				<label>Reason</label>
				<textarea class="input" style="height:80px" placeholder="Explain why this post violates the rules..."></textarea>
			</div>
			<div class="form-field">
				<label><input type="checkbox"> Also block the author</label>
			</div>
			<div class="form-field">
				<label>Your password</label>
				<input type="password" class="input">
			</div>
			<button type="button" class="btn btn-primary btn-block"><img src="assets/icons/block-blanco.png" alt="" class="ico"> Confirm block</button>
			<button type="button" class="btn btn-muted btn-block" style="margin-top:8px" onclick="$('#rcolumn').html('<p/>')">Cancel</button>
			<p class="hint">Mockup only.</p>
		</form>
	</div>
</div>
