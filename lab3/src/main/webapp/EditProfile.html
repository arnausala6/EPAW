<div class="w3-card w3-white">
	<header class="w3-container w3-theme">
		<h3>Edit profile</h3>
	</header>

	<div class="w3-container w3-padding">
		<form>
			<div class="w3-section">
				<label for="editName" class="w3-text-grey">Name</label>
				<input class="w3-input w3-border" type="text" id="editName" name="name" value="Demo User">
			</div>

			<div class="w3-section">
				<label for="editEmail" class="w3-text-grey">Email</label>
				<input class="w3-input w3-border" type="email" id="editEmail" name="email" value="demo@student.upf.edu">
			</div>

			<div class="w3-section">
				<label for="editCountry" class="w3-text-grey">Country</label>
				<select class="w3-input w3-border" id="editCountry" name="country">
					<option>Spain</option>
					<option>France</option>
					<option>Germany</option>
					<option>Other</option>
				</select>
			</div>

			<div class="w3-section">
				<label for="editDescription" class="w3-text-grey">Description</label>
				<textarea class="w3-input w3-border" id="editDescription" name="description" style="height: 100px;">Short public bio shown in the user profile.</textarea>
			</div>

			<div class="w3-section">
				<label for="editPicture" class="w3-text-grey">Profile picture</label>
				<input class="w3-input w3-border" type="file" id="editPicture" name="profilePicture" accept="image/jpeg,image/png,image/webp,image/gif">
			</div>

			<button type="button" class="w3-button w3-theme">
				Save changes
			</button>
		</form>
	</div>
</div>
