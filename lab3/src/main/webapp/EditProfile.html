<div class="card card-flush">
	<div class="card-head">
		<h3>Edit profile</h3>
	</div>
	<div class="card-body">
		<form>
			<div class="form-field">
				<label for="editName">Name</label>
				<input class="input" type="text" id="editName" name="name" value="Demo User">
			</div>

			<div class="form-field">
				<label for="editEmail">Email</label>
				<input class="input" type="email" id="editEmail" name="email" value="demo@student.upf.edu">
			</div>

			<div class="form-field">
				<label for="editCountry">Country</label>
				<select class="input" id="editCountry" name="country">
					<option>Spain</option>
					<option>France</option>
					<option>Germany</option>
					<option>Other</option>
				</select>
			</div>

			<div class="form-field">
				<label for="editDescription">Description</label>
				<textarea class="input" id="editDescription" name="description" style="height: 100px;">Short public bio shown in the user profile.</textarea>
			</div>

			<div class="form-field">
				<label for="editPicture">Profile picture</label>
				<input class="input" type="file" id="editPicture" name="profilePicture" accept="image/jpeg,image/png,image/webp,image/gif">
			</div>

			<button type="button" class="btn btn-primary">Save changes</button>
		</form>
	</div>
</div>
