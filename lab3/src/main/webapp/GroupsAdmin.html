<div class="card card-flush page-head">
	<div class="card-head">
		<h3><img src="assets/icons/grupos-blanco.png" alt="" class="ico"> Groups</h3>
	</div>
	<div class="card-body">
		<div class="card">
			<h4>Create group</h4>
			<div class="form-field">
				<label for="groupName">Group name</label>
				<input class="input" type="text" id="groupName" placeholder="Example: Web Engineering Lab 3">
			</div>
			<div class="form-field">
				<label for="groupDescription">Description</label>
				<textarea class="input" id="groupDescription" style="height: 80px;" placeholder="What is this group about?"></textarea>
			</div>
			<button type="button" class="btn btn-primary"><img src="assets/icons/crear-grupo-terracota.png" alt="" class="ico"> Create group</button>
		</div>

		<div class="card">
			<div class="side-title">Available groups</div>
			<div class="disc">
				<div>
					<div class="g">Web Engineering</div>
					<div class="members">5 members</div>
				</div>
				<div class="btn-row" style="margin-top:0">
					<button type="button" class="btn btn-muted btn-sm"><img src="assets/icons/unirse-terracota.png" alt="" class="ico"> Join</button>
					<button type="button" class="btn btn-err btn-sm btn-block-group" data-users="carlos,laura,miguel,emma,jordi"><img src="assets/icons/block-error.png" alt="" class="ico"> Block</button>
				</div>
			</div>
			<div class="disc">
				<div>
					<div class="g">AI Projects</div>
					<div class="members">4 members · Joined</div>
				</div>
				<div class="btn-row" style="margin-top:0">
					<button type="button" class="btn btn-muted btn-sm"><img src="assets/icons/log-out-suave.png" alt="" class="ico"> Leave</button>
					<button type="button" class="btn btn-err btn-sm btn-block-group" data-users="pau,alice,marc,sofia"><img src="assets/icons/block-error.png" alt="" class="ico"> Block</button>
				</div>
			</div>
			<div class="disc">
				<div>
					<div class="g">Campus Events</div>
					<div class="members">7 members</div>
				</div>
				<div class="btn-row" style="margin-top:0">
					<button type="button" class="btn btn-muted btn-sm"><img src="assets/icons/unirse-terracota.png" alt="" class="ico"> Join</button>
					<button type="button" class="btn btn-err btn-sm btn-block-group" data-users="daniel,marta,tom,anna,pere,james,lucia"><img src="assets/icons/block-error.png" alt="" class="ico"> Block</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script>
document.querySelectorAll('.btn-block-group').forEach(function(btn) {
	btn.addEventListener('click', function() {
		var users = btn.getAttribute('data-users').split(',');
		var checkboxes = users.map(function(u) {
			return '<label class="form-field" style="margin-bottom:8px"><input type="checkbox"> ' + u + '</label>';
		}).join('');

		$('#rcolumn').html(
			'<div class="card card-flush">' +
				'<div class="card-head panel-head">' +
					'<h5><img src="assets/icons/block-blanco.png" alt="" class="ico"> Block group</h5>' +
					'<button type="button" class="panel-close" onclick="$(\'#rcolumn\').html(\'<p/>\')">&times;</button>' +
				'</div>' +
				'<div class="card-body">' +
					'<form>' +
						'<div class="form-field">' +
							'<label>Reason</label>' +
							'<textarea class="input" style="height:80px" placeholder="Explain why this group violates the rules..."></textarea>' +
						'</div>' +
						'<div class="form-field">' +
							'<label>Also block these members</label>' +
							'<div class="card" style="max-height:350px; overflow-y:auto; padding:12px">' + checkboxes + '</div>' +
						'</div>' +
						'<div class="form-field">' +
							'<label>Your password</label>' +
							'<input type="password" class="input">' +
						'</div>' +
						'<button type="button" class="btn btn-primary btn-block"><img src="assets/icons/block-blanco.png" alt="" class="ico"> Confirm block</button>' +
						'<button type="button" class="btn btn-muted btn-block" style="margin-top:8px" onclick="$(\'#rcolumn\').html(\'<p/>\')">Cancel</button>' +
						'<p class="hint">Mockup only.</p>' +
					'</form>' +
				'</div>' +
			'</div>'
		);
	});
});
</script>
