<div class="card card-flush page-head">
	<div class="card-head">
		<h3><img src="assets/icons/grupos-blanco.png" alt="" class="ico"> Groups</h3>
	</div>
	<div class="card-body">
		<div class="card">
			<h4>Create group</h4>
			<div class="form-field">
				<label for="groupName">Group name</label>
				<input class="input" type="text" id="groupName" placeholder="Example: Web Engineering Lab 3">
			</div>
			<div class="form-field">
				<label for="groupDescription">Description</label>
				<textarea class="input" id="groupDescription" style="height: 80px;" placeholder="What is this group about?"></textarea>
			</div>
			<button type="button" class="btn btn-primary"><img src="assets/icons/publicar-blanco.png" alt="" class="ico"> Create group</button>
		</div>

		<div class="card">
			<div class="side-title">Available groups</div>
			<div class="disc">
				<div>
					<div class="g">Web Engineering</div>
					<div class="members">67 members</div>
				</div>
				<button type="button" class="btn btn-primary btn-sm">Join</button>
			</div>
			<div class="disc">
				<div>
					<div class="g">AI Projects</div>
					<div class="members">12 members</div>
				</div>
				<button type="button" class="btn btn-muted btn-sm">Leave</button>
			</div>
			<div class="disc">
				<div>
					<div class="g">Campus Events</div>
					<div class="members">31 members</div>
				</div>
				<button type="button" class="btn btn-primary btn-sm">Join</button>
			</div>
		</div>
	</div>
</div>
