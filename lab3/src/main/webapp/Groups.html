<div class="w3-card w3-white">
	<header class="w3-container w3-theme">
		<h3><i class="fa fa-users"></i> Groups</h3>
	</header>

	<div class="w3-container w3-padding">
		<div class="w3-card w3-margin-bottom">
			<div class="w3-container w3-padding">
				<h4>Create group</h4>
				<div class="w3-section">
					<label for="groupName" class="w3-text-grey">Group name</label>
					<input class="w3-input w3-border" type="text" id="groupName" placeholder="Example: Web Engineering Lab 3">
				</div>
				<div class="w3-section">
					<label for="groupDescription" class="w3-text-grey">Description</label>
					<textarea class="w3-input w3-border" id="groupDescription" style="height: 80px;" placeholder="What is this group about?"></textarea>
				</div>
				<button type="button" class="w3-button w3-theme"><i class="fa fa-plus"></i> Create group</button>
			</div>
		</div>

		<div class="w3-card w3-margin-bottom">
			<div class="w3-container w3-padding">
				<h4>Available groups</h4>
				<ul class="w3-ul w3-border">
					<li>
						<strong>Web Engineering</strong>
						<span class="w3-small w3-text-grey"> · 67 members</span>
						<button type="button" style="font-size: 10px; padding: 5px 10px; margin-left: 350px;">Join</button>
					</li>
					<li>
						<strong>AI Projects</strong>
						<span class="w3-small w3-text-grey"> · 12 members</span>
						<button type="button" style="font-size: 10px; padding: 5px 10px; margin-left: 390px;">Leave</button>
					</li>
					<li>
						<strong>Campus Events</strong>
						<span class="w3-small w3-text-grey"> · 31 members</span>
						<button type="button" style="font-size: 10px; padding: 5px 10px; margin-left: 370px;">Join</button>
					</li>
				</ul>
			</div>
		</div>
	</div>
</div>
