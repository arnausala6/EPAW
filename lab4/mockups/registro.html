<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<link rel="stylesheet" href="mockups.css">

</head>
<body>
<header class="topbar topbar-tabs">
  <nav class="nav nav-tabs">
    <a href="#" class="active">Register</a>
    <a href="#">Log in</a>
    <a href="#">Browse</a>
  </nav>
</header>
<main class="shell">
  <aside class="col-l"></aside>
  <section class="col-c auth">
  <div class="card">
    <div class="card-head"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 12H3"/><path d="M13 8l4 4-4 4"/></svg> Register</div>
    <div class="card-body">
      <div class="form-field">
        <label for="user">Username</label>
        <input id="user" class="input valid" value="mireia_sole94">
        <div class="hint ok">✓ Available</div>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" class="input valid" type="email" value="mireia.sole@upf.edu">
        <div class="hint ok">✓ Valid format</div>
      </div>
      <div class="form-field">
        <label for="pass">Password</label>
        <input id="pass" class="input valid" type="password" value="Maria2026!">
        <div class="hint" style="color:var(--muted)">Minimum requirements: 8 characters, one uppercase letter and one number.</div>
        <div class="hint ok">✓ Valid password</div>
      </div>
      <div class="form-field">
        <label for="pass2">Repeat password</label>
        <input id="pass2" class="input valid" type="password" value="Maria2026!">
        <div class="hint ok">✓ Passwords match</div>
      </div>
      <div class="form-field">
        <label for="age">Age</label>
        <input id="age" class="input valid" type="number" min="1" max="120" value="24">
        <div class="hint ok">✓ Valid age</div>
      </div>
      <div class="form-field">
        <label for="gender">Gender</label>
        <select id="gender" class="input valid">
          <option>—</option>
          <option selected>Female</option>
          <option>Male</option>
          <option>Non-binary</option>
          <option>Prefer not to say</option>
        </select>
      </div>
      <div class="form-field">
        <label for="country">Country (optional)</label>
        <select id="country" class="input valid">
          <option>—</option>
          <option selected>Spain</option>
          <option>France</option>
          <option>Italy</option>
          <option>Portugal</option>
          <option>United Kingdom</option>
        </select>
      </div>
      <div class="form-field">
        <label for="desc">Description (optional)</label>
        <textarea id="desc" class="input valid" rows="3">Apassionada d'ornitologia i senderisme. Sempre buscant noves sortides de cap de setmana.</textarea>
        <div class="hint ok">✓ Valid description</div>
      </div>
      <div class="form-field">
        <label for="photo">Profile picture (optional, max 2MB)</label>
        <input id="photo" class="input valid" type="file" accept="image/*">
        <div class="hint ok">✓ profile_mireia94.jpg (1.2 MB)</div>
      </div>
      <div class="form-field">
        <label for="grupo">Group to join (optional)</label>
        <select id="grupo" class="input valid">
          <option>—</option>
          <option selected>Observadors d'ocells de Catalunya</option>
          <option>Dibuixants urbans BCN</option>
          <option>Curses de trail</option>
        </select>
      </div>
      <button class="btn btn-accent btn-block">Register</button>
      <p class="post-meta" style="text-align:center; margin-top:14px">
        Already have an account? <a href="#">Log in</a>
      </p>
    </div>
  </div>
  </section>
  <aside class="col-r"></aside>
</main>
<footer class="footer">Groupwise · UPF EPAW</footer>
</body>
</html>
